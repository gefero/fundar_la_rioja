name: Sitio estático (GitHub Pages)

# Renderiza dashboard/index.qmd a HTML autocontenido (queda en la raíz del sitio)
# y publica los materiales de clases/ (queda en /clases/), todo en un mismo
# deploy a gh-pages para no pisarse entre sí (peaceiris/actions-gh-pages
# reemplaza el árbol completo en cada corrida con keep_files: false).
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/inputs_md/**"
      - "style/**"
      - "clases/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependencias de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::ggplot2
            any::plotly
            any::here
            any::knitr
            any::rmarkdown

      - name: Render del dashboard
        run: |
          quarto render dashboard/index.qmd
          mkdir -p _site
          cp dashboard/index.html _site/index.html

      - name: Construir el sitio de clases/
        run: |
          set -euo pipefail

          TEMPLATE="clases/_pandoc_template.html"
          OUT="_site/clases"
          mkdir -p "$OUT/materiales"

          render_md () {
            # render_md <origen.md> <destino.html> <título> [subtítulo]
            local titulo_arg=(--metadata "title=$3")
            local subtitulo_arg=()
            if [ -n "${4:-}" ]; then subtitulo_arg=(--metadata "subtitle=$4"); fi
            pandoc "$1" -s -t html5 --template="$TEMPLATE" \
              "${titulo_arg[@]}" "${subtitulo_arg[@]}" -o "$2"
          }

          # ---- Página principal del taller --------------------------------
          render_md clases/index.md "$OUT/index.html" \
            "Taller de visualización de datos" \
            "Monitor La Rioja · Fundar — grupo factor~data"

          # ---- Materiales transversales ------------------------------------
          render_md clases/materiales/checklist_visualizacion.md \
            "$OUT/materiales/checklist_visualizacion.html" \
            "Checklist de visualización"
          render_md clases/materiales/cheatsheet_repo.md \
            "$OUT/materiales/cheatsheet_repo.html" \
            "Cheatsheet — mantenimiento del repositorio"
          cp clases/materiales/00_setup.R "$OUT/materiales/"
          cp clases/materiales/paleta_regional_swatch.R "$OUT/materiales/"
          cp "clases/materiales/Informe_final_argendata.pdf" "$OUT/materiales/"
          cp "clases/Copia de Pract_Clase_1_introducción.pdf" \
             "$OUT/materiales/deck_clase_1_introduccion.pdf"

          # ---- Una clase a la vez ------------------------------------------
          declare -A TITULOS=(
            [clase_1_gramatica_y_percepcion]="Clase 1 — Gramática de gráficos y percepción"
            [clase_2_integridad_y_catalogo]="Clase 2 — Integridad visual y catálogo de herramientas"
            [clase_3_pipeline_y_narrativa]="Clase 3 — Del microdato al producto"
          )

          for dir in "${!TITULOS[@]}"; do
            titulo="${TITULOS[$dir]}"
            src="clases/$dir"
            dst="$OUT/$dir"
            mkdir -p "$dst/ejercicios" "$dst/soluciones"

            if [ -f "$src/practica.md" ]; then
              render_md "$src/practica.md" "$dst/practica.html" "$titulo" "Práctica"
            else
              # Sin consigna aparte (practica.md): se publica directamente el
              # notebook ya renderizado (practica.html, generado localmente
              # con rmarkdown::render sobre practica.Rmd).
              cp "$src/practica.html" "$dst/practica.html"
            fi

            cp "$src/practica.Rmd" "$dst/"
            cp "$src"/*.pdf         "$dst/"               2>/dev/null || true
            cp "$src"/ejercicios/*.R "$dst/ejercicios/" 2>/dev/null || true
            cp "$src"/soluciones/*   "$dst/soluciones/"   2>/dev/null || true

            # Bundle descargable con todo el material de la clase. guion.md queda
            # afuera a propósito: es material interno para quien dicta, no para
            # publicar (ni como página ni adentro del zip).
            (cd clases && zip -rq "../$dst/$dir.zip" "$dir" -x "$dir/guion.md")
          done

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
