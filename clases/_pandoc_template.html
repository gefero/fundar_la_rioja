<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(title)$$title$ · $endif$Taller de visualización — Monitor La Rioja</title>
<style>
  /* Paleta: la misma de style/fundar_monitor_theme.R (FUNDAR_VERDE, FUNDAR_BEIGE,
     FUNDAR_OSCURO, FUNDAR_MULTI serie_3), para que esta sección se sienta parte
     del mismo sitio que el dashboard, no un tema importado de otro lado. */
  :root {
    --bg: #FBFAF6;
    --panel: #FFFFFF;
    --ink: #1C1C1C;        /* FUNDAR_OSCURO / FUNDAR_TEXTO */
    --ink-muted: #6b6558;
    --rule: #E4DFD3;
    --banner-a: #2D6E6E;   /* FUNDAR_MULTI serie_3 — La Rioja */
    --banner-b: #1C1C1C;   /* FUNDAR_OSCURO */
    --accent: #2D6E6E;
    --code-bg: #EDE8E0;    /* FUNDAR_BEIGE */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  a { color: var(--accent); }
  a:hover { text-decoration: none; }

  .site-nav {
    background: var(--ink);
    padding: 10px 24px;
    font-size: 0.82rem;
  }
  .site-nav a {
    color: #EFEAE0;
    text-decoration: none;
    margin-right: 18px;
    letter-spacing: 0.02em;
  }
  .site-nav a:hover { text-decoration: underline; }

  header.banner {
    background: linear-gradient(120deg, var(--banner-a), var(--banner-b));
    color: #FFFFFF;
    padding: 48px 24px 40px;
  }
  header.banner .inner { max-width: 760px; margin: 0 auto; }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #C9E8DE;
    margin: 0 0 10px;
  }
  header.banner h1 {
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    line-height: 1.2;
    margin: 0 0 8px;
  }
  header.banner .subtitle {
    font-size: 1.02rem;
    color: #E4F2ED;
    margin: 0;
    max-width: 60ch;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 36px 24px 64px;
  }

  main h2 {
    margin-top: 2.2em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
  }
  main h3 {
    margin-top: 1.8em;
    color: var(--banner-a);
  }
  main ul { padding-left: 1.3em; }
  main li { margin-bottom: 4px; }

  main blockquote {
    margin: 1.2em 0;
    padding: 10px 18px;
    background: var(--code-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
  }
  main blockquote p { margin: 0.4em 0; }

  code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.88em;
  }
  pre {
    background: var(--code-bg);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.2em 0;
    font-size: 0.92rem;
  }
  th, td {
    border-bottom: 1px solid var(--rule);
    padding: 6px 10px;
    text-align: left;
  }
  th { color: var(--ink-muted); font-weight: 600; }

  hr { border: none; border-top: 1px solid var(--rule); margin: 2.4em 0; }

  footer.site-footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px 48px;
    color: var(--ink-muted);
    font-size: 0.8rem;
  }
  footer.site-footer a { color: var(--ink-muted); }
</style>
</head>
<body>

<nav class="site-nav">
  <!-- Rutas absolutas con el prefijo del repo: esta es una GitHub Project Page
       (usuario.github.io/fundar_la_rioja/), así que un link absoluto funciona
       igual sin importar la profundidad de la página actual. Si el sitio se
       muda de URL, actualizar este prefijo acá (único lugar). -->
  <a href="/fundar_la_rioja/">Monitor La Rioja</a>
  <a href="/fundar_la_rioja/clases/">Taller de visualización</a>
  <a href="https://github.com/gefero/fundar_la_rioja">Repositorio ↗</a>
</nav>

<header class="banner">
  <div class="inner">
    <p class="eyebrow">Fundar · grupo factor~data</p>
    <h1>$if(title)$$title$$else$Taller de visualización de datos$endif$</h1>
    $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
  </div>
</header>

<main>
$body$
</main>

<footer class="site-footer">
  <p>Fundar — grupo factor~data · Monitor Socioeconómico La Rioja</p>
</footer>

</body>
</html>
